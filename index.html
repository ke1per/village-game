 else if(a=="hire"){const t=TEAM.find(r=>r[0]==x);if(!t)return;if(tl(x)>=3)err="Максимальный уровень";else if(S.money<hireCost(x))err=`Не хватает ${fmt(hireCost(x)-S.money)} ₽`;else{S.money-=hireCost(x);S.team=S.team||{};S.team[x]=tl(x)+1;L(`👥 ${t[1]}: уровень ${tl(x)}`);toast(`${t[1]} · ур. ${tl(x)}`)}}
 else if(a=="tutskip"){S.tut=99}
 else if(a=="snd"){S.set=S.set||{};S.set.snd=S.set.snd===0?1:0;toast(S.set.snd?"Звук включён":"Звук выключен")}
 else if(a=="now"){save(true);toast("Сохранено")}
 else if(a=="exp"){const c=btoa(unescape(encodeURIComponent(pack())));try{navigator.clipboard.writeText(c).then(()=>toast("Код скопирован"),()=>prompt("Скопируй код:",c))}catch(e){prompt("Скопируй код:",c)}}
 else if(a=="imp"){const c=prompt("Вставь код сохранения");if(c){try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!o.diff)throw 0;S=o;fixS();tab="city";toast("Сохранение загружено")}catch(e){err="Код не подходит"}}}
 else if(a=="reset"){if(confirm("Начать заново? Весь прогресс пропадёт.")){S=null;save();render();return}}
 if(err)toast(err);else if(a!="tab")save();if(S)achTick();snd(err?"err":a=="tab"?"tick":"ok");render()}
const TABS=[["city","🏘","Город"],["build","🏗","Стройка"],["land","🗺","Земля"],["cash","💰","Казна"],["bills","🧾","Счета"],["more","⋯","Ещё"]];
const nav=()=>`<div class="nav">${TABS.map(([k,i,n])=>`<button class="${tab==k?"on":""}" onclick="A('tab','${k}')"><em>${i}</em>${n}</button>`).join("")}</div>`;
function hud(dl){return`<div class="hud"><div class="top"><div class="pill day">День ${S.day} · <span id="clk"></span></div><button class="pill bl" onclick="A('tab','bills')">🧾 ${dl?dl+" дн.":"сегодня"} · −${sh(billEst(fc(),dl).reduce((a,b)=>a+b,0))}</button><div class="pill money${tab!="city"?" wb":""}"><small>${LV[S.lvl][0]} · ${D().e} ${D().n}</small><span id="mny">${fmt(S.money)}</span> ₽</div>${tab!="city"?`<button id="dbtn2" class="pill hday${S.run?" run":""}" ${S.run?"disabled":""} onclick="A('day')">${S.run?"⏳ День идёт":"▶️ Открыть день "+S.day}</button>`:""}</div><div class="bar"><i id="dp"></i></div></div>`}
function billEst(f,dl){const n=dl+1,u=S.accU+f.upk*n;let lo=0;for(const l of S.loans)lo+=l.days_left<=n?l.left:Math.min(l.left,l.acc+l.per_day*n);return[Math.trunc(u),Math.trunc(lo)]}
function render(){
 if(!S){app.innerHTML=`<div class="card"><h2>Город с нуля</h2>Построй из деревни мегаполис. Выбери сложность и сюжет:</div>`+Object.entries(DF).map(([k,d])=>
  `<button class="card item" style="width:100%" onclick="A('new','${k}')"><b>${d.e} ${d.n} · «${d.t}»</b><span>Старт: ${fmt(d.money)} ₽. ${d.story}<br>${d.perk}</span></button>`).join("");return}
 const f=fc(),n=LV[S.lvl+1],dl=(BILL-S.day%BILL)%BILL;let h=hud(dl);
 if(tab=="city"){
  const run=S.run,l=S.last,z=v=>v||0;
  h+=`<div class="art${cam?" cm":""}">${cam?camSVG():scene()}<div class="cmn">${CAMS[cam]}${cam==0||cam==4?" · "+STN[sel%STN.length]:""}</div><button class="cmv" style="left:6px" onclick="A('cam',(cam+4)%5)">◀</button><button class="cmv" style="right:6px" onclick="A('cam',(cam+1)%5)">▶</button><div id="bl">${BUB.map(b=>bHTML(b,(performance.now()-b.t0)/1000)).join("")}</div><div id="live" class="live">${run?"+"+fmt(S.dayInc*S.p)+" ₽":"☀️ Город ждёт — открой день"}</div></div>${camBar()}
  <div class="ctl"><button id="dbtn" class="main${run?" run":""}" ${run?"disabled":""} onclick="A('day')">${run?"День идёт…":"▶️ Открыть день "+S.day}</button><div class="spd">${[1,2,4].map(v=>`<button class="${S.speed==v?"on":""}" onclick="A('spd',${v})">×${v}</button>`).join("")}</div></div>
  <label class="chk"><input type="checkbox" ${S.auto?"checked":""} onchange="A('auto')"> Без остановок — дни идут подряд</label>`;
  if(!l)h+=`<div class="card"><h2>Как играть</h2>Жми «Открыть день» — город проживёт день, а ты получишь итоги. Пока день идёт, тапай по 💰 над городом: это бонус. Между днями строй, меняй налоги и решай события.</div>`;
  if(S.note)h+=`<div class="card note">${S.note.trim()}</div>`;
  if(l){const tot=l.net+z(l.bon);h+=`<div class="card"><h2>Итоги дня ${l.day}</h2><div class="row"><span>🧾 Налоги</span><b class="good">+${fmt(l.tax)}</b></div><div class="row"><span>🏠 Аренда</span><b class="good">+${fmt(l.rent)}</b></div><div class="row"><span>🏪 Бизнес</span><b class="good">+${fmt(l.comm)}</b></div>${l.bon?`<div class="row"><span>💰 Бонусы за тапы</span><b class="good">+${fmt(l.bon)}</b></div>`:""}${l.int?`<div class="row"><span>💳 Проценты по долгу</span><b class="bad">−${fmt(l.int)}</b></div>`:""}<div class="row"><span>🔧 Содержание (в счёт)</span><b class="bad">−${fmt(z(l.upk))}</b></div>${l.loan?`<div class="row"><span>🏦 Кредиты (в счёт)</span><b class="bad">−${fmt(l.loan)}</b></div>`:""}${l.dpop?`<div class="row"><span>👥 Жители</span><b class="${l.dpop>0?"good":"bad"}">${l.dpop>0?"+":""}${l.dpop}</b></div>`:""}<div class="row tot"><span>Итого за день</span><b class="${tot>=0?"good":"bad"}">${tot>=0?"+":""}${fmt(tot)} ₽</b></div></div>`}
  h+=tutCard()+hints(f)+elCard()+lifeCard()+goalCard();h+=`<div class="card"><div class="row"><span>👥 Жителей</span><b>${fmt(S.pop)} / жилья на ${fmt(f.cap)}</b></div>`+
   (n?`<div class="bar"><i style="width:${Math.min(100,S.pop/n[1]*100)}%"></i></div><div class="mute">до «${n[0]}»: ${fmt(n[1])} жителей</div>`:"")+
   `<div class="row"><span>😊 Настроение</span><b>${Math.trunc(f.h)}/100 · доходы ×${(.8+f.h/250).toFixed(2)}</b></div><div class="mute">Чем выше настроение, тем больше налогов, аренды и дохода бизнеса (от ×0,8 до ×1,2). Растёт от парков, школ, больниц и низкого налога.</div><div class="row"><span>🗺 Свободных участков</span><b>${S.plots}</b></div>
   <div class="row"><span>📈 Прибыль в день</span><b class="${f.net>=0?"good":"bad"}">${f.net>=0?"+":""}${fmt(f.net)} ₽</b></div></div>`;
 }else if(tab=="build"){
  h+=qBar()+utilCard()+upgCard()+safeCard()+insCard()+`<div class="card"><h2>Стройка</h2><span class="mute">Каждое здание занимает участок. Свободно: ${S.plots}. Цена растёт с каждым зданием одного вида.</span></div><div class="grid">`+Object.entries(B).map(([k,b])=>{if(HID.has(k))return"";
   if(S.lvl<b[3])return`<div class="card item lock"><b>🔒 ${b[1]}</b><span>с уровня «${LV[b[3]][0]}»</span></div>`;
   if(NL.includes(k)&&!S.util.light)return`<div class="card item lock"><b>🔒 ${b[1]}</b><span>нужен свет ⚡</span></div>`;
   const e=[];if(b[4])e.push("жильё +"+b[4]);if(b[5])e.push("аренда "+sh(b[5]));if(b[6])e.push("доход "+sh(b[6]));if(b[7])e.push("содерж. −"+sh(b[7]));if(b[8])e.push("настр. "+(b[8]>0?"+":"")+b[8]);
   return`<button class="item" onclick="A('build','${k}')"><b>${b[0]} ${b[1]} ×${cnt(k)}</b><span>${e.join(", ")}</span><b data-q="b:${k}" class="${qCls(k)}">${qLab("b",k)}</b></button>`}).join("")+`</div>`;
 }else if(tab=="land"){
  const pm=S.pm;h+=streetCard();h+=`<div class="card"><h2>Участки</h2><div class="row"><span>Свободных</span><b>${S.plots}</b></div><div class="row"><span>Цена покупки</span><b>${fmt(pPrice())} ₽</b></div><div class="row"><span>Цена продажи</span><b>${fmt(pSell())} ₽</b></div><div class="row"><span>Рынок</span><b>${pm>1.2?"📈 дорого":pm<.8?"📉 дёшево":"➖ обычный"}</b></div><p class="mute">Покупай, когда дёшево, продавай, когда дорого — на этом тоже можно заработать.</p></div>
  ${qBar()}<div class="grid"><button onclick="A('buy')" data-q="pb">${qLab("pb")}</button><button onclick="A('sell')" data-q="ps">${qLab("ps")}</button></div>`;
 }else if(tab=="cash"){
  const mx=Math.max(1,...S.hist.map(Math.abs));
  h+=tarCard()+bankCard();h+=`<div class="card"><h2>Казна</h2><div class="row"><span>🧾 Налог ${S.tax}%</span><b>+${fmt(f.tax)}</b></div><div class="row"><span>🏠 Аренда</span><b>+${fmt(f.rent)}</b></div><div class="row"><span>🏪 Бизнес</span><b>+${fmt(f.comm)}</b></div>${f.int?`<div class="row"><span>💳 Проценты (казна в минусе)</span><b>−${fmt(f.int)}</b></div>`:""}<div class="row"><b>Доход в день</b><b class="good">+${fmt(f.rent+f.comm+f.tax-f.int)} ₽</b></div><div class="row mute"><span>Содержание города в день (платится раз в ${BILL} дней)</span><span>−${fmt(f.upk)}</span></div>
  <p class="mute">Высокий налог — больше денег, но жители недовольны. Низкий — город растёт быстрее.</p><div class="tax">${[5,10,13,20,30].map(r=>`<button class="${r==S.tax?"on":""}" onclick="A('tax',${r})">${r}%</button>`).join("")}</div>
  ${S.hist.length?`<div class="hist">${S.hist.slice(-10).map(x=>`<i class="${x<0?"n":""}" style="height:${Math.max(6,Math.abs(x)/mx*100)}%"></i>`).join("")}</div><div class="mute">Прибыль по дням (с учётом счетов)</div>`:""}</div>`;
 }else if(tab=="bills"){
  const[u,lo]=billEst(f,dl),n1=dl+1,ue=k=>Math.trunc(((S.accUt||{})[k]||0)+f.ut[k]*n1),us=ue("light")+ue("water")+ue("gas"),inc=(f.rent+f.comm+f.tax-f.int)*(dl+1),ok=S.money+inc>=u+lo;
  h+=`<div class="card"><h2>🧾 Следующее списание</h2><div class="big">${dl?"через "+dl+" дн.":"сегодня в конце дня"}</div><span class="mute">Счета списываются автоматически раз в ${BILL} дней — в дни ${BILL}, ${BILL*2}, ${BILL*3}…</span>
  <div class="row" style="margin-top:8px"><span>🔧 Содержание города</span><b>−${fmt(u-us)}</b></div>${["light","water","gas"].filter(k=>S.util[k]).map(k=>`<div class="row"><span>${UT[k][0]} ${UT[k][1]} (счёт за месяц)</span><b>−${fmt(ue(k))}</b></div>`).join("")}<div class="row"><span>🏦 Платежи по кредитам</span><b>−${fmt(lo)}</b></div><div class="row"><b>Итого примерно</b><b>−${fmt(u+lo)} ₽</b></div>
  <p class="${ok?"good":"bad"}">${ok?"✅ Денег хватит":"⚠️ Денег может не хватить — копи или не трать. Просрочка: проценты и штраф 2% по кредиту"}</p></div>
  <div class="card"><h2>🏦 Кредиты</h2><span class="mute">Банк платит сразу, а платежи входят в счёт. Досрочно — скидка 20% на проценты. Не больше двух сразу.</span>`+
  S.loans.map((l,i)=>`<div class="row" style="margin-top:8px"><span>${l.name}: осталось ${fmt(l.left)} ₽ · ещё ${Math.max(0,l.days_left)} дн.</span></div><button style="width:100%" onclick="A('repay',${i})">Погасить за ${sh(early(l))} ₽</button>`).join("")+
  `<div class="grid" style="margin-top:10px">`+LOANS.map(l=>{const t=l[3]+Math.trunc((l[4]-l[3])*D().lk);return S.lvl<l[2]?`<div class="card item lock"><b>🔒 ${l[1]}</b><span>с уровня «${LV[l[2]][0]}»</span></div>`:
   `<button class="item" onclick="A('loan','${l[0]}')"><b>${l[1]}</b><span>+${sh(l[3])} → вернуть ${sh(t)} за ${l[5]} дн.</span></button>`}).join("")+
  RL.map(r=>{const o=rOffer(r);return`<button class="item" onclick="A('loan','${r[0]}')"><b>${r[1]}</b><span>+${sh(o.take)} (+${o.pct}%) за ${r[2]} дн.</span></button>`}).join("")+`</div></div>
  <div class="card"><h2>Прошлые списания</h2>${S.bills.length?S.bills.map(b=>`<div class="row"><span>День ${b.day}</span><span>содержание −${fmt(b.upk)} · кредиты −${fmt(b.loan)}</span></div>`).join(""):"Пока не было. Первое — в конце дня "+BILL+"."}</div>`;
 }else{
  h+=`<div class="card"><h2>Путь к мегаполису</h2>${LV.map((l,i)=>`<div class="row"><span>${i<=S.lvl?"✅":"⬜️"} ${l[0]}</span><span class="mute">${fmt(l[1])} жит.${l[2]?" · +"+sh(l[2]*D().rk):""}</span></div>`).join("")}</div>
  ${moreCards()}<div class="card"><h2>📖 ${D().t}</h2>${D().story}<p class="mute">${D().perk}</p></div>
  <div class="card"><h2>⏱ Время</h2>Ты сам открываешь каждый день. Один день идёт ${DAY} секунд, ×2 и ×4 ускоряют. «Без остановок» запускает следующий день автоматически. Пока открыто событие, время стоит.</div>
  <div class="card"><h2>📜 Что случилось</h2>${S.log.length?[...S.log].reverse().map(([d,t])=>`<div class="row"><span><b>День ${d}</b> · ${t}</span></div>`).join(""):"Пока тихо."}</div>
  <div class="card"><h2>💾 Сохранение</h2><div id="svs" class="mute">Автосохранение включено</div><p class="mute">Игра сохраняется сама каждые 10 секунд и при выходе: в облаке Telegram и на этом устройстве. Код нужен, чтобы перенести город в браузер или на другой аккаунт.</p><div class="grid"><button onclick="A('now')">💾 Сохранить</button><button onclick="A('exp')">📤 Скопировать код</button></div><button style="width:100%;margin-top:8px" onclick="A('imp')">📥 Загрузить по коду</button></div><button style="width:100%" onclick="A('reset')">🔄 Начать заново</button>`;
 }
 h+=nav();
 if(S.event!==null){const[t,o]=EV[S.event];h+=`<div class="sheet"><div class="card"><h2>❗ Событие · время стоит</h2>${t}<div class="note" style="margin:8px 0">💡 <b>Аким советует:</b> ${advise(o).t}</div><div class="mute">😊 Настроение сейчас ${Math.trunc(hap())}/100. От него зависят доходы (×0,8…×1,2): ниже 40 жители не приезжают, ниже 25 — уезжают. Эффект решения слабеет примерно за 2 недели.</div>${o.map((x,i)=>`<button onclick="A('ev',${i})"${i==advise(o).i?' style="border-color:#e6a82c"':''}>${i==advise(o).i?"⭐ ":""}${x[0]}${x[3]>0&&S.pop>=capac()?" ⚠️ жилья нет — не приедут":""}<small class="ef">${effText(x)}</small></button>`).join("")}${S.later==null?'<button onclick="A(&quot;ev&quot;,&quot;later&quot;)">'+(o.some(x=>x[3]>0&&S.pop>=capac())?'⏳ Отложить: сначала построю дома':o.some(x=>x[1]<0&&S.money+x[1]<0)?'⏳ Отложить: сначала накоплю денег':'⏳ Подумать до завтра')+'</button><div class="mute" style="margin-top:4px">Событие вернётся завтра. Пока можно строить, покупать участки и копить деньги.</div>':""}</div></div>`}
 h+=extraSheets();app.innerHTML=h;paint()}
load(()=>{render();requestAnimationFrame(frame)});
setInterval(()=>{if(S)save()},10000);addEventListener("pagehide",()=>{if(S)save(true)});document.addEventListener("visibilitychange",()=>{if(document.hidden&&S)save(true)});
</script></body></html>
